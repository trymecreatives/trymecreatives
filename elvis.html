
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elvis | TRYME CREATIVES</title>
    <link rel="stylesheet" href="elvis.css">
    <script src="elvis.js" defer></script>
</head>
<body>

<header class="elvis-header">

    <!-- TOP NAVIGATION -->
    <div class="top-bar">
        <a href="index.html" class="back-arrow" aria-label="Back">⬅</a>
        <span class="elvis-name">Elvis</span>

        <div class="social-icons">
            <a href="https://wa.me/" aria-label="WhatsApp">
                <img src="Whatsapp Icon-01.png" alt="WhatsApp">
            </a>

            <a href="https://facebook.com/" aria-label="Facebook">
                <img src="Facebook Icon-01.png" alt="Facebook">
            </a>

            <a href="https://instagram.com/" aria-label="Instagram">
                <img src="Instagram Icons-01.png" alt="Instagram">
            </a>

            <button id="menuButton" class="menu-button"
                    aria-label="Open menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <nav id="headerMenu" class="dropdown-menu">
            <a href="index.html">Home</a>
            <a href="#productDetails">Product information</a>
            <a href="#productPhoto">Selected photo</a>
        </nav>
    </div>

    <!-- MAIN HEADER CONTENT -->
    <div class="header-content">

        <!-- LEFT: PRODUCT INFORMATION -->
        <section class="product-card" id="productDetails">
            <div class="product-info">
                <p><strong>Name:</strong> <span id="productName">Fatoon</span></p>
                <p><strong>Price:</strong> <span id="productPrice">150/=</span></p>
                <p><strong>Size:</strong> <span id="productSize">XXL</span></p>
                <p><strong>Key Feature:</strong></p>
                <p id="productFeatures">Add product features here</p>
                <p><strong>Units Left:</strong> <span id="productUnits">14</span></p>
            </div>

            <button class="selected-photo" id="productPhoto"
                    aria-label="View selected photo">
                <img id="mainPhoto" src="product1.jpg" alt="Selected product">
            </button>
        </section>

        <!-- RIGHT: TOP SLIDESHOW AND CONTACT -->
        <aside class="right-sidebar">

            <div class="featured-pictures" id="featuredSlider">
                <div class="featured-track">
                    <div class="featured-slide">
                        <img src="Elvis Roysambu 6.jpg" alt="Featured picture 1">
                    </div>

                    <div class="featured-slide">
                        <img src="Elvis Roysambu 8.jpg" alt="Featured picture 2">
                    </div>

                    <div class="featured-slide">
                        <img src="Elvis Roysambu 9.jpg" alt="Featured picture 3">
                    </div>

                    <div class="featured-slide">
                        <img src="Elvis Roysambu 10.jpg" alt="Featured picture 4">
                    </div>
                </div>
            </div>

            <p class="contact-label">Contact: 07*******</p>

        </aside>

    </div>

</header>


<!-- RIGHT: SEPARATE LOWER SCROLLABLE CARDS -->

        <!-- CARD 1 -->

        <!-- CARD 5 -->

        <!-- CARD 7 -->

                <img src="feature18.jpg" alt="Featured picture 14" loading="lazy">
            </div>
        </div>


        <!-- CARD 8 -->
        <div class="lower-picture">
            <div class="fade-gallery">
                <img src="feature19.jpg" alt="Featured picture 15" loading="lazy">
                <img src="feature20.jpg" alt="Featured picture 16" loading="lazy">

        </div>



    </div>
